name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Security guardrails (secret hygiene)
        run: |
          set -euo pipefail

          if rg --hidden --no-ignore-vcs -n "OPENAI[_-]?API[_-]?KEY"             --glob "!pnpm-lock.yaml"             --glob "!SECURITY.md"             --glob "!README.md"; then
            echo "Found forbidden OpenAI API key reference."
            exit 1
          fi

          tracked_env_files="$(git ls-files | rg -n '(^|/)\.env(\..+)?$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Tracked .env files are not allowed:"
            echo "$tracked_env_files"
            exit 1
          fi

          if rg --hidden --no-ignore-vcs -n "(hf_[A-Za-z0-9]{12,}|r8_[A-Za-z0-9]{12,}|sk_[A-Za-z0-9]{12,})"             --glob "!pnpm-lock.yaml"; then
            echo "Potential token-like secret found in repository."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Smoke test (web example)
        run: pnpm test -- test/smoke.test.ts

      - name: Build
        run: pnpm build
